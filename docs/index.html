<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe3cf">
<link rel="icon" href="data:,">
<title>合成小吃 · H5 休闲小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(130% 90% at 50% 0%, #fff3e2 0%, #ffe3cd 45%, #f7cdb4 100%);
    color: #5b4436;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: url("assets/bg.jpg") center / cover no-repeat; }
  #hud { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 10px; padding: 10px 16px 2px; }
  #hud .score { flex: 1; line-height: 1; }
  #hud .score .label { font-size: 10px; letter-spacing: 3px; color: #fff6ea; opacity: .9; text-shadow: 0 1px 3px rgba(60,35,15,.65); }
  #hud .score .val { font-size: 30px; font-weight: 800; color: #e4574f; font-variant-numeric: tabular-nums; text-shadow: 0 2px 6px rgba(60,35,15,.5); transition: transform .16s cubic-bezier(.34, 1.56, .64, 1); }
  #hud .score .val.pop { transform: scale(1.16); }
  #hud .score .best { font-size: 11px; color: #ffe9d2; opacity: .9; text-shadow: 0 1px 3px rgba(60,35,15,.65); margin-top: 3px; }
  #hud .next { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #hud .next .label { font-size: 10px; letter-spacing: 2px; color: #fff6ea; opacity: .9; text-shadow: 0 1px 3px rgba(60,35,15,.65); }
  #nextCv { width: 44px; height: 44px; }
  .icon-btn { width: 38px; height: 38px; border: none; border-radius: 12px; background: #ffffffaa; color: #5b4436; font-size: 17px; box-shadow: 0 2px 6px #d9a98b55; cursor: pointer; }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn.wide { width: auto; padding: 0 12px; font-size: 12.5px; font-weight: 700; }
  #over .ghost-btn { width: 100%; margin-top: 8px; border: 2px solid #e4574f2e; border-radius: 14px; padding: 11px 0; font-size: 14px; font-weight: 700; background: #fff4e8; color: #b23f38; cursor: pointer; }
  #over .ghost-btn:active { transform: scale(.97); }
  #shareCard { position: fixed; inset: 0; background: #1c120acc; display: flex; align-items: center; justify-content: center; z-index: 60; padding: 18px; }
  #shareCard.hidden { display: none; }
  #shareCard .sc-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%; }
  #shareImg { max-width: min(82vw, 400px); max-height: 60vh; border-radius: 16px; box-shadow: 0 16px 50px #0009; }
  .sc-hint { font-size: 12px; color: #ffe9d2; opacity: .92; text-align: center; line-height: 1.6; }
  .sc-dl { font-size: 13px; color: #ffd9a8; text-decoration: underline; }
  .sc-close { border: none; border-radius: 999px; padding: 9px 36px; background: #fffaf3; color: #5b4436; font-size: 14px; font-weight: 700; cursor: pointer; }
  .link-row { margin-top: 12px; display: flex; gap: 8px; justify-content: center; align-items: center; }
  .link-row .link { margin-top: 0; }
  .link-dot { font-size: 12px; color: #b09a83; }
  #startScreen { position: fixed; inset: 0; z-index: 50; background-color: #241811; background-image: linear-gradient(rgba(30,18,8,0.15), rgba(30,18,8,0.55)), url("assets/bg_start.jpg"); background-position: center top; background-size: auto 112%; background-repeat: no-repeat; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #startScreen.hidden { display: none; }
  .start-card {
    width: min(360px, 92vw); height: 100%; overflow-y: auto;
    background: transparent; padding: 9vh 0 max(5vh, env(safe-area-inset-bottom));
    text-align: center; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  }
  .start-head { text-align: center; }
  .start-body { width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .start-title { font-size: 34px; font-weight: 800; color: #fffaf3; letter-spacing: 2px; text-shadow: 0 2px 12px rgba(40,22,8,0.8), 0 1px 2px rgba(40,22,8,0.6); }
  .start-sub { font-size: 12.5px; color: #ffe9d2; margin-top: -6px; text-shadow: 0 1px 6px rgba(40,22,8,0.85); }
  .start-stats { background: rgba(255,250,243,0.74); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; box-shadow: 0 6px 20px rgba(40,22,8,0.25); }
  .stat-best { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .stat-best .lbl { font-size: 12px; color: #a08468; }
  .stat-best .num { font-size: 30px; font-weight: 800; color: #e4574f; }
  .start-album-row { display: flex; justify-content: center; gap: 4px; }
  .start-slot { width: 30px; height: 30px; border-radius: 9px; background: #e9dbc9; }
  .start-slot.lit { background: #fff6e6; box-shadow: 0 0 0 2px #e8a33d55; }
  .start-slot canvas { display: block; width: 100%; height: 100%; }
  .start-album-line { font-size: 11px; color: #8a6a4d; }
  .start-daily { font-size: 12px; color: #6b5445; }
  .start-primary { border: none; border-radius: 14px; padding: 14px 0; font-size: 17px; font-weight: 800; background: #e4574f; color: #fff; box-shadow: 0 8px 20px #e4574f44; cursor: pointer; }
  .start-primary:active { transform: scale(.97); }
  .start-secondary { border: 2px solid #e4574f33; border-radius: 14px; padding: 11px 0; font-size: 14px; font-weight: 700; background: #fff4e8; color: #b23f38; cursor: pointer; }
  .start-secondary:active { transform: scale(.97); }
  .start-row { display: flex; gap: 10px; }
  .start-mini { flex: 1; border: none; border-radius: 12px; padding: 10px 0; font-size: 13.5px; font-weight: 700; background: #efe2d2; color: #5b4436; cursor: pointer; }
  .start-mini:active { transform: scale(.97); }
  .start-album-detail { background: rgba(255,250,243,0.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-radius: 14px; padding: 8px 12px; max-height: 30vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; text-align: left; box-shadow: 0 6px 20px rgba(40,22,8,0.25); }
  .start-album-detail.hidden { display: none; }
  .start-album-detail .row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5b4436; }
  .start-album-detail .row canvas { width: 26px; height: 26px; }
  .start-album-detail .row .cnt { margin-left: auto; color: #a08468; font-size: 12px; }
  .start-foot { font-size: 11px; color: #ffe9d2; text-shadow: 0 1px 6px rgba(40,22,8,0.85); }
  #toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 104px); transform: translateX(-50%);
    background: #5b4436ee; color: #fff; font-size: 12.5px; padding: 8px 16px; border-radius: 999px;
    opacity: 0; transition: opacity .35s; pointer-events: none; z-index: 40; white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  #rotate {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: #5b4436e6; color: #fff; font-size: 12px; padding: 7px 14px; border-radius: 999px;
    display: none; pointer-events: none; z-index: 45; white-space: nowrap;
  }
  @media (orientation: landscape) and (max-height: 520px) {
    #rotate { display: block; }
  }
  #stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #cv { display: block; touch-action: none; }
  #hint {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #5b4436e0; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px;
    transition: opacity .6s; pointer-events: none; white-space: nowrap;
  }
  #over { position: fixed; inset: 0; background: #3d2b1f66; display: flex; align-items: center; justify-content: center; padding: 24px; backdrop-filter: blur(3px); }
  #over.hidden { display: none; }
  #over .card {
    position: relative;
    background: #fffaf3; border-radius: 22px; padding: 26px 24px; width: min(320px, 100%);
    text-align: center; box-shadow: 0 18px 50px #5b443644; animation: pop .28s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #over .t1 { font-size: 15px; opacity: .7; }
  #over .val { font-size: 44px; font-weight: 800; color: #e4574f; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
  #over .t2 { font-size: 12px; opacity: .6; margin-bottom: 10px; }
  #over .album-row { display: flex; justify-content: center; gap: 4px; margin: 2px 0 6px; }
  #over .album-slot { position: relative; width: 30px; height: 30px; border-radius: 9px; background: #ede1d2; }
  #over .album-slot.lit { background: #fff6e6; box-shadow: 0 0 0 2px #e8a33d55, 0 2px 5px #d9a98b44; }
  #over .album-slot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #over .album-slot .new-tag { position: absolute; top: -8px; right: -7px; font-size: 8px; font-weight: 800; color: #fff; background: #e4574f; border-radius: 999px; padding: 1px 4px; }
  #over .album-slot .new-tag.hidden { display: none; }
  #over .album-line { font-size: 11px; color: #8a6a4d; margin-bottom: 12px; }
  #over .full-badge {
    display: inline-block; margin: 2px auto 8px; font-size: 12px; font-weight: 800; color: #6b4a12;
    background: linear-gradient(180deg, #ffe9ad, #f5c95c); border-radius: 999px; padding: 5px 14px;
    box-shadow: 0 3px 10px #d9a02d55;
  }
  #over .full-badge.hidden { display: none; }
  #over .card.celebrate { animation: goldpulse 1.4s ease-in-out 2; }
  @keyframes goldpulse { 0%, 100% { box-shadow: 0 18px 50px #5b443444; } 50% { box-shadow: 0 0 0 6px #e8a33d66, 0 18px 50px #5b443444; } }
  #confetti { position: absolute; inset: 0; overflow: hidden; border-radius: 22px; pointer-events: none; }
  #confetti span { position: absolute; top: -14px; width: 7px; height: 11px; border-radius: 2px; animation-name: confFall; animation-timing-function: linear; animation-fill-mode: forwards; }
  @keyframes confFall { to { transform: translateY(340px) rotate(620deg); opacity: .25; } }
  #over button {
    width: 100%; border: none; border-radius: 14px; padding: 13px 0; font-size: 16px; font-weight: 700;
    background: #e4574f; color: #fff; box-shadow: 0 6px 16px #e4574f55; cursor: pointer;
  }
  #over button:active { transform: scale(.97); }
  #over .link { display: inline-block; margin-top: 14px; font-size: 12px; color: #b08968; text-decoration: none; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="hud">
    <div class="score">
      <div class="label">分数</div>
      <div class="val" id="score">0</div>
      <div class="best" id="best">最佳 0</div>
    </div>
    <div class="next">
      <div class="label">下一个</div>
      <canvas id="nextCv" width="88" height="88"></canvas>
    </div>
    <button class="icon-btn" id="restart" title="重开">↻</button>
    <button class="icon-btn" id="mute" title="声音">🔊</button>
    <button class="icon-btn wide" id="modeBtn" title="切换模式">🌞 每日挑战</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="hint">按住左右拖动 · 松手投下 · 两个相同合体升级</div>
  <div id="toast"></div>
  <div id="rotate">建议竖屏游玩 · 横屏也能玩</div>
  <div id="startScreen">
    <div class="start-card">
      <div class="start-head">
        <div class="start-title">🍜 合成小吃</div>
        <div class="start-sub">8 种小吃 · 合成到火锅</div>
      </div>
      <div class="start-stats">
        <div class="stat-best"><span class="lbl">最佳成绩</span><span class="num" id="startBest">0</span></div>
        <div class="start-album-row" id="startAlbumRow"></div>
        <div class="start-album-line" id="startAlbumLine">图鉴 0/8</div>
        <div class="start-daily" id="startDaily">☀️ 今日挑战待挑战</div>
      </div>
      <div class="start-body">
      <div class="start-album-detail hidden" id="startAlbumDetail"></div>
      <button id="startPlay" class="start-primary">▶ 开始游戏</button>
      <button id="startDailyBtn" class="start-secondary">☀️ 每日挑战</button>
      <div class="start-row">
        <button id="startAlbumBtn" class="start-mini">📖 图鉴</button>
        <button id="startSoundBtn" class="start-mini">🔊 音效</button>
      </div>
      <div class="start-foot">游客即可开玩 · 成绩保存在本机</div>
      </div>
    </div>
  </div>
  <div id="shareCard" class="hidden">
    <div class="sc-wrap">
      <img id="shareImg" alt="战绩卡" />
      <div class="sc-hint">长按图片可直接保存到相册<br>电脑端可点下方链接下载</div>
      <a id="shareDl" class="sc-dl" download="合成小吃-战绩卡.png">下载图片</a>
      <button id="shareClose" class="sc-close">关闭</button>
    </div>
  </div>
  <div id="over" class="hidden">
    <div class="card">
      <div class="t1">🧺 收摊了！</div>
      <div class="val" id="finalScore">0</div>
      <div class="t2" id="finalSub">最佳 0</div>
      <div class="full-badge hidden" id="fullBadge">🏆 满汉全席 · 全部收齐</div>
      <div class="album-row" id="albumRow"></div>
      <div class="album-line" id="albumLine">图鉴 0/8</div>
      <button id="again">再来一局</button>
      <button id="shareBtn" class="ghost-btn">📸 生成战绩卡</button>
      <div class="link-row"><a class="link" id="homeLink" href="#">🏠 主界面</a></div>
      <div id="confetti"></div>
    </div>
  </div>

<script src="matter.min.js"></script>
<script>
(function () {
  'use strict';

  function boot() {
    if (typeof Matter !== 'undefined') { start(); return; }
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js';
    s.onload = start;
    s.onerror = function () {
      document.getElementById('hint').textContent = '物理引擎加载失败：请把 matter.min.js 放在本文件旁边';
    };
    document.head.appendChild(s);
  }

  function start() {
    var MM = Matter;
    var Engine = MM.Engine, Composite = MM.Composite, Bodies = MM.Bodies, Body = MM.Body, Events = MM.Events, Sleeping = MM.Sleeping;

    // ======== 世界尺寸（逻辑单位，渲染时整体缩放） ========
    var W = 120, H = 182;
    var JAR = { l: 12, r: 108, t: 20, b: 166 };   // 罐子内壁
    var DANGER_Y = 38;                            // 警戒线
    var SPAWN_Y = 10;                             // 待投放位置
    var DROP_COOLDOWN = 0.35;
    var MAX_ABOVE_TIME = 1.6;                     // 越过警戒线多久判负
    var POP_DUR = 0.16;                           // 合成弹出动画时长

    // 段位设计：半径按约 1.32 倍递增，颜色+表情双重区分
    var TIERS = [
      { name: '汤圆',   color: '#ffffff', edge: '#d9cfc2', r: 4.4 },
      { name: '饺子',   color: '#fdf3d3', edge: '#e0cda2', r: 5.8 },
      { name: '小笼包', color: '#ffe9cd', edge: '#e6c398', r: 7.7 },
      { name: '煎饼',   color: '#f8d18e', edge: '#d8a75f', r: 10.1 },
      { name: '肉夹馍', color: '#efbb6e', edge: '#c68d47', r: 13.4 },
      { name: '汉堡',   color: '#ec9351', edge: '#bf6a30', r: 17.6 },
      { name: '蛋糕',   color: '#f2a3b8', edge: '#cf7a92', r: 23.3 },
      { name: '火锅',   color: '#e65a50', edge: '#b03a34', r: 30.7 }
    ];
    var MERGE_SCORE = [0, 2, 4, 8, 16, 32, 64, 128];  // 合成出第 t 级的得分
    var TOP_BONUS = 256;                              // 双火锅对撞奖励
    var DROP_TIERS = 4;                               // 随机投放前 4 级

    // 贴图资源：存在则用 Holopix 贴图，缺失自动回退矢量绘制
    var FOOD_IMGS = [];
    for (var fi = 0; fi < 8; fi++) {
      var fim = new Image();
      fim.src = 'assets/food_0' + fi + '.webp';
      FOOD_IMGS.push(fim);
    }
    var FACE_DY = [0, 0.06, -0.32, 0, -0.06, -0.04, 0.08, -0.2];   // 各段落表情纵向偏移（按贴图微调）
    var bgCardImg = new Image(); bgCardImg.src = 'assets/bg.jpg';

    // ======== DOM ========
    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    var nextCv = document.getElementById('nextCv');
    var nctx = nextCv.getContext('2d');
    var scoreEl = document.getElementById('score');
    var bestEl = document.getElementById('best');
    var overEl = document.getElementById('over');
    var finalScoreEl = document.getElementById('finalScore');
    var finalSubEl = document.getElementById('finalSub');
    var hintEl = document.getElementById('hint');
    var muteBtn = document.getElementById('mute');
    var restartBtn = document.getElementById('restart');
    var againBtn = document.getElementById('again');
    var albumRowEl = document.getElementById('albumRow');
    var albumLineEl = document.getElementById('albumLine');
    var fullBadgeEl = document.getElementById('fullBadge');
    var confettiEl = document.getElementById('confetti');
    var cardEl = document.querySelector('#over .card');
    var modeBtn = document.getElementById('modeBtn');
    var toastEl = document.getElementById('toast');
    var shareBtn = document.getElementById('shareBtn');
    var shareEl = document.getElementById('shareCard');
    var shareImg = document.getElementById('shareImg');
    var shareDl = document.getElementById('shareDl');
    var shareClose = document.getElementById('shareClose');
    var startEl = document.getElementById('startScreen');
    var startBestEl = document.getElementById('startBest');
    var startAlbumRowEl = document.getElementById('startAlbumRow');
    var startAlbumLineEl = document.getElementById('startAlbumLine');
    var startDailyEl = document.getElementById('startDaily');
    var startAlbumDetailEl = document.getElementById('startAlbumDetail');
    var startPlayBtn = document.getElementById('startPlay');
    var startDailyBtn = document.getElementById('startDailyBtn');
    var startAlbumBtn = document.getElementById('startAlbumBtn');
    var startSoundBtn = document.getElementById('startSoundBtn');
    var homeLinkEl = document.getElementById('homeLink');
    var startSlots = [];

    // ======== 物理世界 ========
    var engine = Engine.create({ enableSleeping: true });
    engine.positionIterations = 10;
    engine.gravity.y = 0.65;
    var world = engine.world;
    var wallOpts = { isStatic: true, friction: 0.4, restitution: 0.1 };
    Composite.add(world, [
      Bodies.rectangle(JAR.l - 5, 91, 10, 176, wallOpts),
      Bodies.rectangle(JAR.r + 5, 91, 10, 176, wallOpts),
      Bodies.rectangle(W / 2, JAR.b + 5, 500, 10, wallOpts)
    ]);

    // ======== 游戏状态 ========
    var score = 0;
    var best = parseInt(localStorage.getItem('hb_merge_best') || '0', 10) || 0;
    var bestAtStart = best;
    var recordShown = false;
    var popTimer = null;

    // ======== 图鉴收集（跨局永久记录） ========
    var album = (function () {
      var a = null;
      try { a = JSON.parse(localStorage.getItem('hb_merge_album') || 'null'); } catch (e0) { a = null; }
      if (!a || !a.counts || a.counts.length !== 8) a = { counts: [0, 0, 0, 0, 0, 0, 0, 0] };
      return a;
    })();
    var newlyCaught = {};
    var fullSeen = localStorage.getItem('hb_merge_album_full') === '1';
    var albumSquares = [];
    function saveAlbum() { try { localStorage.setItem('hb_merge_album', JSON.stringify(album)); } catch (e1) {} }
    function albumCatch(tier) {
      var c0 = album.counts[tier] || 0;
      album.counts[tier] = c0 + 1;
      if (c0 === 0) newlyCaught[tier] = true;
      saveAlbum();
    }

    // ======== 模式与每日挑战 ========
    var mode = 'classic';
    var dailyRng = null;
    function todayStr() {
      var d = new Date();
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }
    function mulberry32(a) {
      return function () {
        var t0 = (a = (a + 0x6D2B79F5) | 0);
        t0 = Math.imul(t0 ^ (t0 >>> 15), t0 | 1);
        t0 = (t0 ^ (t0 + Math.imul(t0 ^ (t0 >>> 7), t0 | 61))) >>> 0;
        return ((t0 ^ (t0 >>> 14)) >>> 0) / 4294967296;
      };
    }
    function dailySeed() { return parseInt(todayStr().replace(/-/g, ''), 10); }
    function getDailyRec() {
      try {
        var r0 = JSON.parse(localStorage.getItem('hb_merge_daily') || 'null');
        if (r0 && r0.date === todayStr()) return r0;
      } catch (e3) {}
      return null;
    }
    function saveDailyRec(sc, tier) {
      try { localStorage.setItem('hb_merge_daily', JSON.stringify({ date: todayStr(), score: sc, tier: tier })); } catch (e4) {}
    }
    var toastTimer = null;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);

    // ======== 背景音乐：WebAudio 合成的轻快循环（108 BPM，C-Am-F-G，旋律清晰、配器精简） ========

    var BGM_MELODY_BARS = [
      [[0, 7, 2], [2, 9, 1], [3, 7, 1], [4, 4, 2], [6, 5, 1], [7, 4, 1]],

      [[0, 5, 2], [2, 9, 1], [3, 7, 1], [4, 5, 2], [6, 2, 2]],

    function bgmKickDrum(when) {

      o.frequency.setValueAtTime(150, when);

      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);

    }
    function bgmLead(freq, when, dur) {
      var o = actx.createOscillator(), g = actx.createGain();

      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(0.085, when + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, when + Math.max(0.12, dur));

    function ripple(mx, my, mr, power) {

      for (var i = 0; i < all.length; i++) {
        var b = all[i];

        var dx = b.position.x - mx, dy = b.position.y - my;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d > mr || d < 0.001) continue;
        var k = (1 - d / mr) * power;
        Body.setVelocity(b, { x: b.velocity.x + (dx / d) * k, y: b.velocity.y + (dy / d) * k - k * 0.3 });

        c.beginPath(); c.arc(0, 0, r * 0.48, 0, 6.2832);
        c.fillStyle = '#f9ccd8'; c.fill();
        var spk = [['#ffd23e', -1.9], ['#7fd2ff', -1.1], ['#9d7bff', 2.6], ['#5ce1a4', 0.9], ['#ff8fb2', 1.9]];
        for (var sk = 0; sk < spk.length; sk++) {
          c.save();
          c.translate(Math.cos(spk[sk][1]) * r * 0.66, Math.sin(spk[sk][1]) * r * 0.66);
          c.rotate(spk[sk][1]);
          c.fillStyle = spk[sk][0];
          c.fillRect(-r * 0.07, -r * 0.03, r * 0.14, r * 0.06);
          c.restore();
        }
        c.fillStyle = '#e5484d';
        c.beginPath(); c.arc(r * 0.17, -r * 0.44, r * 0.15, 0, 6.2832); c.fill();
        c.beginPath(); c.arc(r * 0.17, -r * 0.44, r * 0.15, 0, 6.2832);
        c.strokeStyle = '#cf7a92'; c.lineWidth = Math.max(0.6, r * 0.04); c.stroke();
        c.strokeStyle = '#7a4a20'; c.lineWidth = Math.max(0.6, r * 0.05);
        c.beginPath(); c.moveTo(r * 0.17, -r * 0.56); c.quadraticCurveTo(r * 0.26, -r * 0.74, r * 0.4, -r * 0.7); c.stroke();
        faceOf(c, r, asleep, r * 0.05);
      } else {
        // 火锅：锅沿锅把 + 红汤 + 浮料 + 蒸汽
        c.fillStyle = '#565660';
        roundRect(c, -r * 1.06, -r * 0.2, r * 0.24, r * 0.4, r * 0.1); c.fill();
        roundRect(c, r * 0.82, -r * 0.2, r * 0.24, r * 0.4, r * 0.1); c.fill();
        c.beginPath(); c.arc(0, 0, r, 0, 6.2832);
        c.fillStyle = '#565660'; c.fill();
        c.strokeStyle = '#3d3d46'; c.lineWidth = lw; c.stroke();
        c.beginPath(); c.arc(0, 0, r * 0.8, 0, 6.2832);
        var g7 = c.createRadialGradient(0, -r * 0.15, r * 0.1, 0, 0, r * 0.8);
        g7.addColorStop(0, '#d4503a'); g7.addColorStop(1, '#a5311f');
        c.fillStyle = g7; c.fill();
        c.fillStyle = 'rgba(255,255,255,0.9)';
        c.save(); c.translate(-r * 0.3, 0); c.rotate(0.35); c.fillRect(-r * 0.14, -r * 0.14, r * 0.28, r * 0.28); c.restore();
        c.fillStyle = '#6fae4a';
        c.beginPath(); c.arc(r * 0.32, r * 0.22, r * 0.15, 0, 6.2832); c.fill();
        c.beginPath(); c.arc(r * 0.18, r * 0.42, r * 0.09, 0, 6.2832); c.fill();
        c.fillStyle = '#e8a33d';
        c.beginPath(); c.ellipse(-r * 0.28, r * 0.42, r * 0.12, r * 0.05, 0.5, 0, 6.2832); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.35)';
        c.beginPath(); c.arc(r * 0.34, -r * 0.32, r * 0.07, 0, 6.2832); c.fill();
        c.beginPath(); c.arc(r * 0.02, -r * 0.5, r * 0.05, 0, 6.2832); c.fill();
        if (!asleep) {
          // 蒸汽固定朝上（世界坐标），不随锅体旋转
          c.save();
          c.rotate(-(angle || 0));
          var tt = performance.now() / 1000;
          c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = Math.max(0.8, r * 0.05); c.lineCap = 'round';
          for (var wi = 0; wi < 2; wi++) {
            var wx = (wi - 0.5) * r * 0.55;
            c.beginPath();
            c.moveTo(wx, -r * 0.9);
            c.bezierCurveTo(wx + r * 0.14, -r * 1.06, wx - r * 0.14, -r * 1.24, wx + Math.sin(tt * 2 + wi * 2) * r * 0.09, -r * 1.42);
            c.stroke();
          }
          c.restore();
        }
        faceOf(c, r, asleep, r * 0.06, '#ffe9d6');
      }
      c.restore();
    }
    function drawJar() {
      var g = ctx.createLinearGradient(0, JAR.t, 0, JAR.b);
      g.addColorStop(0, 'rgba(255,255,255,0.85)');
      g.addColorStop(1, 'rgba(255,246,236,0.55)');
      roundRect(ctx, JAR.l, JAR.t, JAR.r - JAR.l, JAR.b - JAR.t, 10);
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = '#dbb99a'; ctx.lineWidth = 2.4; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(W / 2, JAR.b + 4, 52, 4, 0, 0, 6.2832);
      ctx.fillStyle = 'rgba(150,100,70,0.12)'; ctx.fill();
    }
    function drawDangerLine(tS) {
      var warn = Math.min(1, overTimer / MAX_ABOVE_TIME);
      var pulse = 0.3 + 0.15 * Math.sin(tS * 4);
      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = 'rgba(228,87,79,' + (pulse + warn * 0.45) + ')';
      ctx.beginPath(); ctx.moveTo(JAR.l + 3, DANGER_Y); ctx.lineTo(JAR.r - 3, DANGER_Y); ctx.stroke();
      ctx.restore();
      if (overTimer > 0.25) {
        ctx.save();
        ctx.fillStyle = 'rgba(228,87,79,' + (0.5 + warn * 0.5) + ')';
        ctx.font = '700 9px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
        ctx.fillText('危!', JAR.r - 4, DANGER_Y - 3);
        ctx.fillStyle = 'rgba(228,87,79,0.2)';
        ctx.fillRect(JAR.l + 3, DANGER_Y + 2.5, JAR.r - JAR.l - 6, 2);
        ctx.fillStyle = '#e4574f';
        ctx.fillRect(JAR.l + 3, DANGER_Y + 2.5, (JAR.r - JAR.l - 6) * warn, 2);
        ctx.restore();
      }
    }
    function drawNextPreview() {
      nctx.clearRect(0, 0, 88, 88);
      if (curTier < 0) return;
      drawPiece(nctx, 44, 44, 14 + curTier * 5, curTier, 0, false);
    }
    function render(tS) {
      ctx.setTransform(scale * dprV, 0, 0, scale * dprV, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake * 0.5, (Math.random() - 0.5) * shake * 0.5);

      drawJar();
      drawDangerLine(tS);

      var all = Composite.allBodies(world);
      for (var i = 0; i < all.length; i++) {
        var bd = all[i];
        if (bd.label !== 'piece') continue;
        var ps = 1;
        if (bd.popT > 0) ps = 0.5 + 0.5 * easeOutBack(1 - bd.popT / POP_DUR);
        drawPiece(ctx, bd.position.x, bd.position.y, bd.circleRadius * ps, bd.tier, bd.angle, bd.isSleeping && bd.speed < 0.05);
      }

      if (!gameOver && curTier >= 0 && !dropping && cooldown <= 0) {
        var r = TIERS[curTier].r;
        ctx.save();
        ctx.globalAlpha = 0.14;
        ctx.strokeStyle = '#8a6a52'; ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(aimCur, SPAWN_Y + r + 1); ctx.lineTo(aimCur, JAR.b - 2); ctx.stroke();
        ctx.restore();
        drawPiece(ctx, aimCur, SPAWN_Y + Math.sin(tS * 3.2) * 0.7, r, curTier, 0, false);
      }

      var j;
      for (j = 0; j < rings.length; j++) {
        var rg = rings[j];
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - rg.t / rg.life) * 0.8;
        ctx.strokeStyle = rg.color; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, 6.2832); ctx.stroke();
        ctx.restore();
      }
      for (j = 0; j < particles.length; j++) {
        var p = particles[j];
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
        ctx.restore();
      }
      for (j = 0; j < floats.length; j++) {
        var f = floats[j];
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - f.t / f.life);
        ctx.fillStyle = f.color;
        ctx.font = '700 ' + f.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(f.text, f.x, f.y);
        ctx.restore();
      }

      ctx.restore();
      if (flash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.6, flash * 1.6) + ')';
        ctx.fillRect(0, 0, W, H);
      }
    }

    // ======== 主循环 ========
    var lastT = performance.now(), acc = 0, tS = 0;
    document.addEventListener('visibilitychange', function () {
      lastT = performance.now();
      if (!actx) return;
      if (document.hidden) { if (actx.state === 'running') actx.suspend(); }
      else if (actx.state === 'suspended') actx.resume();
    });
    function frame(now) {
      requestAnimationFrame(frame);
      var dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      tS += dt;
      if (cooldown > 0) {
        cooldown -= dt;
        if (cooldown <= 0 && dropping && !gameOver) beginNext();
      }
      aimCur += (aimX - aimCur) * Math.min(1, dt * 22);
      acc += dt;
      var steps = 0;
      while (acc >= 1 / 60 && steps < 4) {
        Engine.update(engine, 1000 / 60);
        acc -= 1 / 60; steps++;
      }
      // 抑制静止前的残余微滚动，避免物件自己在罐底慢慢漂移
      var dampBodies = Composite.allBodies(world);
      for (var di = 0; di < dampBodies.length; di++) {
        var db = dampBodies[di];
        if (db.label !== 'piece' || db.isSleeping) continue;
        if (db.popT > 0) db.popT = Math.max(0, db.popT - dt);
        if (db.velocity.y > 6.5) db.velocity.y = 6.5;   // 终端速度：落地更"钝"，避免打水漂
        if (db.speed < 1.5 && Math.abs(db.angularVelocity) < 0.35) db.angularVelocity *= 0.7;
      }
      updateDanger(dt);
      updateFx(dt);
      render(tS);
    }

    beginNext();
    buildAlbumRow();
    updateModeBtn();
    buildStartAlbum();
    showStartScreen();
    window.addEventListener('load', function () {
      if (!startEl.classList.contains('hidden')) paintStartScreen();
    });
    requestAnimationFrame(frame);
    setTimeout(function () { hintEl.style.opacity = 0; }, 9000);

    // 调试钩子（自动化测试用）
    window.__hbMerge = {
      state: function () {
        return { score: score, gameOver: gameOver, curTier: curTier, overTimer: overTimer, bodies: Composite.allBodies(world).filter(function (b) { return b.label === 'piece'; }).length, piecePairs: statPiecePairs, merges: statMerges, album: album.counts.slice(), mode: mode, dailyDone: !!getDailyRec() };
      },
      list: function () {
        return Composite.allBodies(world).filter(function (b) { return b.label === 'piece'; }).map(function (b) {
          return { tier: b.tier, x: Math.round(b.position.x * 10) / 10, y: Math.round(b.position.y * 10) / 10, sleep: !!b.isSleeping, speed: Math.round(b.speed * 100) / 100 };
        });
      },
      setAimWorld: function (x) { if (curTier >= 0) { var r = TIERS[curTier].r; aimCur = aimX = Math.min(Math.max(x, JAR.l + r + 1), JAR.r - r - 1); } },
      drop: drop,
      spawn: function (tier, x) {
        var b = makePiece(tier, x, SPAWN_Y);
        Body.setVelocity(b, { x: 0, y: 2 });
        Composite.add(world, b);
        return b.id;
      },
      _placeSleeping: function (tier, x, y) {
        var b = makePiece(tier, x, y);
        Sleeping.set(b, true);
        Composite.add(world, b);
        return b.id;
      },
      _albumFill: function (v) {
        for (var i = 0; i < 8; i++) album.counts[i] = v || 1;
        saveAlbum();
      },
      _peekDailySeq: function (n) {
        var rr = mulberry32(dailySeed()), arr = [];
        for (var i = 0; i < n; i++) arr.push((rr() * DROP_TIERS) | 0);
        return arr;
      },
      _dailyRec: function () { return getDailyRec(); },
      _bgm: function () { return !!bgmTimer; },
      _imgReady: function () {
        var out = [];
        for (var ii = 0; ii < FOOD_IMGS.length; ii++) out.push(!!(FOOD_IMGS[ii].complete && FOOD_IMGS[ii].naturalWidth > 0));
        return out;
      },
      drawPiece: drawPiece
    };
  }

  boot();
})();
</script>
</body>
